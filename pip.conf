# Pip config for local dev. Routes any package in the ai-manifests namespace
# (adp-agent, adp-agent-anchor, adj-manifest, adp-manifest, acb-manifest) to
# the Gitea PyPI feed, and everything else to the public PyPI mirror.
#
# Activate by either setting PIP_CONFIG_FILE=./pip.conf in your shell, or by
# copying this file to ~/.config/pip/pip.conf (Linux/macOS) or
# %APPDATA%\pip\pip.ini (Windows).
#
# When installing via `pip install -e .` from this repo root, pip picks up
# the Gitea index automatically if this file is at $PIP_CONFIG_FILE.

[global]
extra-index-url = https://git.marketally.com/api/packages/ai-manifests/pypi/simple
